const state={records:[],view:"dashboard",filter:{},page:{}};

function openTP(r=blank("tp")){if(!r.tp_fase)r.tp_fase="Fase C";if(!r.tp_kelas)r.tp_kelas="6";modal(r.__backendId?"Ubah Tujuan Pembelajaran":"Tambah Tujuan Pembelajaran",`<form id="tpForm" class="grid gap-4 md:grid-cols-2"><label class="block text-sm font-semibold">Mata Pelajaran<select id="tp_mapel" class="field mt-1" required>${mapelOptions(r.tp_mapel)}</select></label><label class="block text-sm font-semibold">CP Terkait<select id="tp_cp_id" class="field mt-1"><option value="">Pilih CP</option>${get("cp").map(c=>`<option value="${c.__backendId}" ${r.tp_cp_id===c.__backendId?"selected":""}>${esc(c.cp_elemen)} — ${esc(nameMapel(c.cp_mapel))}</option>`).join("")}</select></label>${control("tp_fase","Fase","text",r.tp_fase)}${control("tp_kelas","Kelas","text",r.tp_kelas)}${control("tp_semester","Semester","select:1|2",r.tp_semester)}${control("tp_elemen","Elemen / Domain","text",r.tp_elemen)}${control("tp_urutan","Nomor Urut","number",r.tp_urutan)}${control("tp_status","Status","select:Draft|Ditinjau|Siap Digunakan",r.tp_status)}${control("tp_tujuan","Tujuan Pembelajaran","textarea",r.tp_tujuan)}${control("tp_indikator","Indikator Ketercapaian","textarea",r.tp_indikator)}${control("tp_materi","Materi","textarea",r.tp_materi)}${control("tp_alokasi","Alokasi Waktu","text",r.tp_alokasi)}<div class="md:col-span-2 text-right"><button class="rounded-xl bg-[#2674c7] px-4 py-2 font-bold text-white">Simpan Tujuan</button></div></form>`);tpForm.onsubmit=e=>saveForm(e,r,["tp_mapel","tp_cp_id","tp_fase","tp_kelas","tp_semester","tp_elemen","tp_urutan","tp_status","tp_tujuan","tp_indikator","tp_materi","tp_alokasi"],"Tujuan pembelajaran tersimpan.",x=>x.tp_urutan=+tp_urutan.value)}
function moduleFields(){return [["ma_nama","Nama Modul"],["ma_mapel","Mata Pelajaran","mapel"],["ma_kelas","Kelas"],["ma_fase","Fase"],["ma_semester","Semester"],["ma_penyusun","Penyusun"],["ma_tahun_ajaran","Tahun Ajaran"],["ma_alokasi","Alokasi Waktu"],["ma_pertemuan","Pertemuan"],["ma_cp_id","CP Terkait","cp"],["ma_tp_id","Tujuan Pembelajaran","tp"],["ma_elemen","Elemen / Domain"],["ma_prasyarat","Prasyarat"],["ma_kriteria","Kriteria Ketercapaian"],["ma_kompetensi_awal","Kompetensi Awal"],["ma_pemahaman_bermakna","Pemahaman Bermakna"],["ma_pertanyaan_pemantik","Pertanyaan Pemantik"],["ma_materi","Materi"],["ma_model","Model Pembelajaran"],["ma_pendahuluan","Pendahuluan"],["ma_kegiatan_inti","Kegiatan Inti"],["ma_penutup","Penutup"],["ma_refleksi_guru","Refleksi Guru"],["ma_refleksi_siswa","Refleksi Siswa"],["ma_asesmen_diagnostik","Asesmen Diagnostik"],["ma_asesmen_formatif","Asesmen Formatif"],["ma_asesmen_sumatif","Asesmen Sumatif"],["ma_teknik","Teknik"],["ma_instrumen","Instrumen"],["ma_rubrik","Rubrik / Kriteria"],["ma_remedial","Remedial"],["ma_pengayaan","Pengayaan"],["ma_diff_konten","Diferensiasi Konten"],["ma_diff_proses","Diferensiasi Proses"],["ma_diff_produk","Diferensiasi Produk"],["ma_diff_dukungan","Dukungan Kebutuhan Beragam"],["ma_buku","Buku"],["ma_bahan_ajar","Bahan Ajar"],["ma_alat","Alat"],["ma_media","Media"],["ma_lingkungan","Lingkungan"],["ma_catatan_keamanan","Catatan Keamanan"],["ma_catatan_guru","Catatan Guru"],["ma_status","Status"]]}
function openModule(r=blank("module")){let isEdit=!!r.__backendId;if(!r.ma_kelas)r.ma_kelas="6";if(!r.ma_fase)r.ma_fase="Fase C";if(!r.ma_status)r.ma_status="Draft";let groups=[["Identitas",moduleFields().slice(0,9)],["Kurikulum",moduleFields().slice(9,14)],["Rencana Pembelajaran",moduleFields().slice(14,24)],["Asesmen",moduleFields().slice(24,32)],["Diferensiasi",moduleFields().slice(32,36)],["Media",moduleFields().slice(36,41)],["Catatan Guru",moduleFields().slice(41)]];let inp=(x)=>{let[k,l,t]=x;if(t==="mapel")return `<label class="block text-sm font-semibold">${l}<select id="${k}" class="field mt-1">${mapelOptions(r[k])}</select></label>`;if(t==="cp")return `<label class="block text-sm font-semibold">${l}<select id="${k}" class="field mt-1"><option value="">Pilih CP</option>${get("cp").map(c=>`<option value="${c.__backendId}" ${r[k]===c.__backendId?"selected":""}>${esc(c.cp_elemen)}</option>`).join("")}</select></label>`;if(t==="tp")return `<label class="block text-sm font-semibold">${l}<select id="${k}" class="field mt-1"><option value="">Pilih tujuan</option>${get("tp").map(c=>`<option value="${c.__backendId}" ${r[k]===c.__backendId?"selected":""}>${esc(c.tp_tujuan)}</option>`).join("")}</select></label>`;if(k==="ma_status")return control(k,l,"select:Draft|Ditinjau|Siap Digunakan",r[k]);return control(k,l,k.includes("pendahuluan")||k.includes("kegiatan")||k.includes("asesmen")||k.includes("refleksi")||k.includes("diff")||k.includes("catatan")||k.includes("materi")||k.includes("kriteria")?"textarea":"text",r[k])};modal(isEdit?"Ubah Modul Ajar":"Tambah Modul Ajar",`<form id="moduleForm"><div class="flex flex-wrap gap-2 border-b pb-3">${groups.map((g,i)=>`<button type="button" class="tab-btn rounded-lg px-3 py-2 text-xs font-bold ${i===0?"active":""}" data-tab="${i}">${g[0]}</button>`).join("")}</div>${groups.map((g,i)=>`<div class="tab-pane ${i===0?"active":""} pt-5" data-pane="${i}"><div class="grid gap-4 md:grid-cols-2">${g[1].map(x=>`<div class="${x[0].includes("ma_nama")||x[0].includes("asesmen")||x[0].includes("kegiatan")||x[0].includes("refleksi")||x[0].includes("diff")||x[0].includes("catatan")?"md:col-span-2":""}">${inp(x)}</div>`).join("")}</div></div>`).join("")}<div class="mt-6 flex items-center justify-between border-t pt-4"><span id="progressText" class="text-sm text-[#647b90]">Kelengkapan akan dihitung saat disimpan.</span><div class="flex gap-2"><button type="button" onclick="closeModal()" class="rounded-xl border px-4 py-2 font-bold">Batal</button><button class="rounded-xl bg-[#2674c7] px-4 py-2 font-bold text-white">Simpan Modul</button></div></div></form>`);document.querySelectorAll(".tab-btn").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab-btn").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".tab-pane").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelector(`[data-pane="${b.dataset.tab}"]`).classList.add("active")});moduleForm.onsubmit=e=>saveModule(e,r)}
async function saveModule(e,r){e.preventDefault();let b=e.submitter;b.disabled=true;b.textContent="Menyimpan...";let fields=moduleFields().map(x=>x[0]),n={...r};fields.forEach(k=>n[k]=document.getElementById(k).value.trim());if(!n.ma_nama||!n.ma_mapel){toast("Nama modul dan mata pelajaran wajib diisi.");b.disabled=false;b.textContent="Simpan Modul";return}n.ma_progress=Math.round(fields.filter(k=>String(n[k]||"").trim()).length/fields.length*100);let out=r.__backendId?await window.dataSdk.update(n):await window.dataSdk.create(n);if(out.isOk){closeModal();toast("Modul ajar berhasil disimpan.");}else{toast("Modul belum dapat disimpan.");b.disabled=false;b.textContent="Simpan Modul"}}
function openSubjectTemplates(){let arr=[["Pendidikan Agama dan Budi Pekerti","Pilihan agama dapat dikonfigurasi"],["Pendidikan Pancasila",""],["Bahasa Indonesia",""],["Matematika",""],["IPAS",""],["PJOK",""],["Seni","Seni Rupa, Musik, Tari, atau Teater"],["Bahasa Inggris","Dapat diaktifkan sesuai kebijakan sekolah"],["Muatan Lokal","Dapat diisi dan diaktifkan atau dinonaktifkan"]];modal("Template Mata Pelajaran",`<p class="text-sm text-[#647b90]">Tambahkan mata pelajaran yang diperlukan ke Canva Sheet.</p><div class="mt-4 space-y-2">${arr.map(x=>`<button onclick="createSubject('${esc(x[0])}','${esc(x[1])}')" class="w-full rounded-xl border p-3 text-left hover:bg-[#f1f8ff]"><b>${x[0]}</b><span class="block text-xs text-[#71869a]">${x[1]||"Mata pelajaran aktif"}</span></button>`).join("")}</div>`)}
async function createSubject(name,variant){let r=blank("subject");r.mp_name=name;r.mp_variant=variant;r.mp_enabled=true;let x=await window.dataSdk.create(r);if(x.isOk){closeModal();toast("Mata pelajaran ditambahkan.")}else toast("Data belum dapat ditambahkan.")}
function openModuleTemplates(){let items=[["Pendidikan Agama dan Budi Pekerti","Perilaku terpuji dan tanggung jawab"],["Pendidikan Pancasila","Nilai Pancasila, hak dan kewajiban, musyawarah, dan hidup bermasyarakat"],["Bahasa Indonesia","Memahami informasi, menyimpulkan, menulis teks informatif atau argumentatif sederhana, dan presentasi"],["Matematika","Bilangan, pecahan, perbandingan, pengukuran, geometri, data, dan pemecahan masalah"],["IPAS","Manusia dan lingkungan, energi atau materi, ekosistem, bumi, masyarakat, dan kegiatan ekonomi lokal"],["PJOK","Kebugaran, permainan atau olahraga, keselamatan, kesehatan, dan pola hidup sehat"],["Seni","Apresiasi dan penciptaan karya sesuai pilihan seni"],["Bahasa Inggris","Kosakata, ungkapan, dan teks pendek sesuai konteks — aktif sesuai kebijakan sekolah"],["Muatan Lokal","Template kosong: isi nama muatan lokal, konteks daerah, CP atau kompetensi, dan topik"]];modal("Contoh Draft yang Dapat Disesuaikan",`<p class="text-sm text-[#647b90]">Pilih contoh draft untuk membuka formulir Modul Ajar yang dapat diedit.</p><div class="mt-4 grid gap-3 md:grid-cols-2">${items.map((x,i)=>`<button onclick="useTemplate(${i})" class="rounded-xl border p-4 text-left hover:border-[#2674c7] hover:bg-[#f7fbff]"><span class="badge draft">CONTOH DRAFT YANG DAPAT DISESUAIKAN</span><b class="mt-3 block">${x[0]}</b><span class="mt-1 block text-xs text-[#71869a]">${x[1]}</span></button>`).join("")}</div>`);window.templateItems=items}
function useTemplate(i){let [mapel,topik]=window.templateItems[i],r=blank("module"),s=subjects().find(x=>x.mp_name===mapel);r.ma_nama="Contoh draft yang dapat disesuaikan — "+topik;r.ma_mapel=s?.__backendId||"";r.ma_kelas="6";r.ma_fase="Fase C";r.ma_semester="1";r.ma_materi=topik;r.ma_status="Draft";r.ma_pemahaman_bermakna="Peserta didik membangun pemahaman melalui konteks yang dekat dengan kehidupan sehari-hari.";r.ma_model="Pembelajaran aktif dan kolaboratif";closeModal();openModule(r)}
function exportCP(){let r=get("cp"),h=["Mata Pelajaran","Fase","Elemen","Ringkasan","Pemetaan Kelas 6","Referensi","Status","Pembaruan"];exportPreview("CP_Fase_C",h,r.map(x=>[nameMapel(x.cp_mapel),x.cp_fase,x.cp_elemen,x.cp_ringkasan,x.cp_pemetaan_kelas,x.cp_referensi,x.cp_status,x.cp_updated]))}
function exportTP(){let r=get("tp"),h=["Mata Pelajaran","Fase","Kelas","Semester","Tujuan","Indikator","Materi","Alokasi","Urutan","Status"];exportPreview("Tujuan_Pembelajaran",h,r.map(x=>[nameMapel(x.tp_mapel),x.tp_fase,x.tp_kelas,x.tp_semester,x.tp_tujuan,x.tp_indikator,x.tp_materi,x.tp_alokasi,x.tp_urutan,x.tp_status]))}
function exportModules(){let r=get("module"),h=["Nama Modul","Mata Pelajaran","Kelas","Fase","Semester","Alokasi","Status","Progress"];exportPreview("Modul_Ajar_Kelas_6",h,r.map(x=>[x.ma_nama,nameMapel(x.ma_mapel),x.ma_kelas,x.ma_fase,x.ma_semester,x.ma_alokasi,x.ma_status,x.ma_progress]))}
async function saveForm(e,r,keys,msg,after){e.preventDefault();let b=e.submitter;b.disabled=true;b.textContent="Menyimpan...";let n={...r};keys.forEach(k=>n[k]=document.getElementById(k).value.trim());after?.(n);let x=r.__backendId?await window.dataSdk.update(n):await window.dataSdk.create(n);if(x.isOk){closeModal();toast(msg)}else{toast("Data belum dapat disimpan.");b.disabled=false;b.textContent="Simpan"}}
function openSimple(type,r=blank(type)){let fs=simpleFields[type];modal(r.__backendId?"Ubah Data":"Tambah Data",`<form id="simpleForm" class="grid gap-4 md:grid-cols-2">${fs.map(x=>`<div class="${x[2]==="textarea"?"md:col-span-2":""}">${control(x[0],x[1],x[2]||"text",r[x[0]])}</div>`).join("")}<div class="md:col-span-2 text-right"><button class="rounded-xl bg-[#2674c7] px-4 py-2 font-bold text-white">Simpan</button></div></form>`);simpleForm.onsubmit=e=>saveForm(e,r,fs.map(x=>x[0]),"Data berhasil disimpan.")}
function edit(type,id){let r=find(id);if(type==="subject")openSubject(r);else if(type==="cp")openCP(r);else if(type==="tp")openTP(r);else if(type==="module")openModule(r);else openSimple(type,r)}
function detail(type,id){let r=find(id);if(type==="module"){modal("Pratinjau Modul Ajar",`<div class="space-y-4"><div><p class="text-xs text-[#71869a]">MODUL AJAR</p><h3 class="text-xl font-bold">${esc(r.ma_nama)}</h3><p class="text-sm text-[#647b90]">${esc(nameMapel(r.ma_mapel))} · Kelas ${esc(r.ma_kelas)} · ${esc(r.ma_fase)}</p></div>${[["Tujuan Pembelajaran",r.ma_tp_id?get("tp").find(x=>x.__backendId===r.ma_tp_id)?.tp_tujuan:""],["Materi",r.ma_materi],["Kegiatan Inti",r.ma_kegiatan_inti],["Asesmen Formatif",r.ma_asesmen_formatif],["Catatan Guru",r.ma_catatan_guru]].map(x=>`<section class="rounded-xl bg-[#f6faff] p-4"><h4 class="font-bold">${x[0]}</h4><p class="mt-1 text-sm whitespace-pre-wrap">${esc(x[1])||"—"}</p></section>`).join("")}<div class="no-print flex justify-end gap-2"><button onclick="window.print()" class="rounded-xl border px-4 py-2 font-bold">Cetak / PDF</button><button onclick="closeModal()" class="rounded-xl bg-[#12345b] px-4 py-2 font-bold text-white">Tutup</button></div></div>`);return}let keys=type==="cp"?["cp_elemen","cp_ringkasan","cp_pemetaan_kelas","cp_referensi","cp_status"]:type==="tp"?["tp_tujuan","tp_indikator","tp_materi","tp_alokasi","tp_status"]:type==="subject"?["mp_name","mp_variant","mp_notes","mp_enabled"]:simpleFields[type].map(x=>x[0]);modal("Detail Data",`<div class="space-y-3">${keys.map(k=>`<div class="rounded-xl bg-[#f6faff] p-3"><p class="text-xs font-bold uppercase text-[#73889b]">${esc(k.replaceAll("_"," "))}</p><p class="mt-1 text-sm whitespace-pre-wrap">${esc(r[k])||"—"}</p></div>`).join("")}</div>`)}
function confirmDelete(id){modal("Hapus Data",`<div class="text-center"><i data-lucide="trash-2" class="mx-auto text-red-600"></i><p class="mt-4 font-bold">Hapus data ini?</p><p class="mt-2 text-sm text-[#6d8195]">Data yang dihapus tidak dapat dipulihkan.</p><div class="mt-6 flex justify-center gap-3"><button onclick="closeModal()" class="rounded-xl border px-4 py-2 font-bold">Batal</button><button id="deleteGo" class="rounded-xl bg-red-600 px-4 py-2 font-bold text-white">Ya, Hapus</button></div></div>`);deleteGo.onclick=async()=>{deleteGo.disabled=true;deleteGo.textContent="Menghapus...";let x=await window.dataSdk.delete(find(id));if(x.isOk){closeModal();toast("Data berhasil dihapus.")}else{toast("Data belum dapat dihapus.");deleteGo.disabled=false}}}
function profileModal(){let p=get("profile")[0]||blank("profile");modal("Profil Guru",`<form id="profileForm"><label class="block text-sm font-semibold">Nama Tampilan Guru<input id="teacher_name" class="field mt-1" value="${esc(p.teacher_name)}" required></label><div class="mt-5 text-right"><button class="rounded-xl bg-[#2674c7] px-4 py-2 font-bold text-white">Simpan Nama</button></div></form>`);profileForm.onsubmit=e=>saveForm(e,p,["teacher_name"],"Profil guru berhasil disimpan.")}
function navigate(v){state.view=v;document.querySelectorAll(".page-view").forEach(x=>x.classList.toggle("active",x.id===v));document.querySelectorAll(".nav-item").forEach(x=>x.classList.toggle("active",x.dataset.view===v));pageTitle.textContent=labels[v];breadcrumb.textContent=(v==="modulDashboard"||["mapel","cp","tp","module"].includes(v)?"KURIKULUM KELAS 6":"ADMINISTRASI")+" / "+labels[v].toUpperCase();renderView(v)}
function renderView(v){({dashboard:renderDashboard,kelas:()=>renderLegacy("kelas"),siswa:()=>renderLegacy("siswa"),jadwal:()=>renderLegacy("jadwal"),jurnal:()=>renderLegacy("jurnal"),absen:renderAbsen,nilai:renderNilai,modulDashboard:renderModulDashboard,mapel:renderMapel,cp:renderCP,tp:renderTP,module:renderModule}[v])();lucide.createIcons()}
document.querySelectorAll(".nav-item").forEach(x=>x.onclick=()=>navigate(x.dataset.view));closeModal.addEventListener("click",closeModal);profileButton.onclick=profileModal;headerProfile.onclick=profileModal;globalSearch.oninput=e=>{if(e.target.value){navigate("siswa");setFilter("siswa","search",e.target.value)}};
const handler={onDataChanged(data){state.records=data;profileButton.textContent=teacher();teacherNameHeader.textContent=teacher();renderView(state.view)}};
(async()=>{let r=await window.dataSdk.init(handler);if(!r.isOk)toast("Canva Sheet belum dapat dimuat. Coba muat ulang halaman.");renderView("dashboard");lucide.createIcons()})();
</script>
 
</body></html>
